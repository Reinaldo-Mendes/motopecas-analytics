# Roda lint e testes a cada push e pull request (CI = Integração Contínua).
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Instalar dependências (versões exatas do uv.lock)
        run: uv sync --locked

      - name: requirements.txt em dia com o uv.lock (usado pelo Streamlit Cloud)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o /tmp/req.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)

      - name: Lint e formatação (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Testes (pytest)
        run: uv run pytest
